name: Desplegar Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verificar secretos de Cloudflare
        working-directory: .
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CUENTA" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID. Créelos en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Verificar que se configuró el id de D1
        run: |
          if grep -q "REEMPLAZAR_CON_ID" wrangler.toml; then
            echo "::error::Falta poner el database_id real en worker/wrangler.toml (npx wrangler d1 create ordenes-db)."
            exit 1
          fi

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "lts/*"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Revisar tipos
        run: npm run tipos

      - name: Aplicar migraciones en D1
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply ordenes-db --remote

      - name: Desplegar Worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
